name: Tests

# Runs the whole test suite on every push and pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tests read the import workbook back with Python's openpyxl.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install openpyxl
      - run: npm test
